<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to ATWOPAT Official Website...</title>
    
    <!-- Changed content="0;..." to content="2;..." to delay the HTML fallback redirect -->
    <meta http-equiv="refresh" content="2;url=https://atwopat.org.ng/">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            color: #0f3c7d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .redirect-box {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        a {
            color: #184b94;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="redirect-box">
        <h2>Redirecting to ATWOPAT Nigeria...</h2>
        <p>If you are not redirected automatically within a few seconds, 
           <a href="https://atwopat.org.ng/">click here to visit our official homepage</a>.
        </p>
    </div>

    <script>
        // Wrapped the redirect in a setTimeout function to delay it by 2000 milliseconds (2 seconds)
        setTimeout(function() {
            window.location.href = "https://atwopat.org.ng/";
        }, 2000);
    </script>
</body>
</html>
